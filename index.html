<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English ES4 Trainer</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2233;--mut:#6b7488;--pri:#4f46e5;--pri2:#eef0ff;--ok:#16a34a;--okbg:#e7f8ee;--bad:#dc2626;--badbg:#fdeceb;--line:#e3e7f0;--warn:#f59e0b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1320;--card:#181d30;--ink:#eef1fb;--mut:#98a2bd;--pri:#818cf8;--pri2:#23284a;--ok:#4ade80;--okbg:#12301f;--bad:#f87171;--badbg:#3a1618;--line:#2a3150;--warn:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.mut{color:var(--mut);font-size:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px}
button:hover{border-color:var(--pri)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
button.big{width:100%;padding:14px;font-size:16px}
button.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:99px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.opt{display:block;width:100%;text-align:left;margin:8px 0;font-size:17px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.q{font-size:20px;font-weight:650;margin:10px 0 14px;white-space:pre-line}
input[type=text],textarea{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{font-size:14px;min-height:140px;font-family:ui-monospace,Consolas,monospace}
input:focus,textarea:focus{outline:none;border-color:var(--pri)}
.fb{border-radius:12px;padding:12px;margin:12px 0}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border:2px dashed var(--line);border-radius:12px;margin-bottom:10px}
.chip{padding:8px 12px;border-radius:10px;background:var(--pri2);border:1px solid var(--pri);font-size:17px;font-weight:600}
.flash{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;cursor:pointer}
.flash .w{font-size:34px;font-weight:800}
.tag{font-size:12px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.04em}
.big-num{font-size:44px;font-weight:800;line-height:1}
.back{background:none;border:0;color:var(--mut);padding:4px 0;margin-bottom:6px}
.rule{background:var(--pri2);border-left:4px solid var(--pri);padding:10px 12px;border-radius:10px;margin:12px 0;font-weight:600}
.ex{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ex .en{font-weight:700}
.ex button{flex:none}
.note{background:var(--okbg);border-left:4px solid var(--ok);padding:10px 12px;border-radius:10px;margin:12px 0}
.note.warn{background:var(--badbg);border-left-color:var(--bad)}
.tbl{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--pri2)}
.ck{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:14px 0}
.ck .q2{font-weight:700}
.ckfb{margin-top:6px;font-size:14px}
.lp{margin:8px 0}
/* Diseño adaptable: móviles pequeños, móviles grandes, tablets y escritorio */
:root{--button-primary:#4f46e5}
@media (prefers-color-scheme:dark){:root{--button-primary:#4338ca}}
html{font-size:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden}
#app{width:100%;max-width:720px;padding:16px max(16px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button{min-height:44px;max-width:100%;touch-action:manipulation;overflow-wrap:anywhere}
button.pri{background:var(--button-primary);border-color:var(--button-primary);color:white}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,.flash:focus-visible{outline:3px solid var(--pri);outline-offset:3px}
.row,.ex,.card,.top,.top>*,.row>div,.ex>div{min-width:0}
.top{flex-wrap:wrap}
.row{flex-wrap:wrap}
.row>div[style*="flex:1"]{flex:1 1 170px}
.row>.sm{flex:0 0 auto}
.tbl{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.tbl table{width:max-content;min-width:100%;max-width:none}
.tbl td,.tbl th{min-width:96px;overflow-wrap:break-word}
.q,.en,.mut,.lp,.rule,.note,.flash .w{overflow-wrap:anywhere}
input[type=text],textarea{font-size:16px;min-width:0}
.chip{min-height:44px;max-width:100%;white-space:normal}
.pills{row-gap:8px}
@media (max-width:600px){
  #app{padding-top:12px}
  .top{align-items:flex-start;gap:10px}
  .top h1{font-size:20px}
  .pills{width:100%}
  .card{padding:14px;border-radius:14px}
  .q{font-size:19px}
  .flash .w{font-size:clamp(24px,8vw,34px)}
}
@media (max-width:440px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .row{gap:8px}
  .row>div[style*="flex:1"]{flex:1 1 100%;width:100%}
  .row>.sm{flex:1 1 auto}
  #app{padding-right:12px;padding-left:12px}
  .pill{font-size:12px;padding:5px 9px}
  .ex{align-items:flex-start}
  .q{font-size:18px}
  .card{padding:12px}
  h2{font-size:17px}
}
@media (max-width:340px){
  #app{padding-left:9px;padding-right:9px}
  .pills{gap:5px}
  .pill{font-size:11px;padding:5px 7px}
  .card{padding:10px}
  .row>.sm{font-size:13px}
}
@media (min-width:441px) and (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ====== Config ====== */
const EXAM = new Date('2026-12-04T08:00:00');
const GOAL = 20;
const LS = 'ing_es4_trainer_v1';
const LS_SESSION = 'ing_es4_trainer_session_v1';
const TOPICS = {be:'Was / Were',reg:'Regulares (-ed)',irr:'Irregulares',neg:"Negativo (didn't)",q:'Preguntas (Did…?)',conn:'Conectores',time:'Tiempo, fechas y clima',vocab:'Vocabulario del libro',read:'Lectura',dict:'Listening (dictado)',write:'Escritura guiada'};
const PLAN = [ // [desde, hasta, titulo, temas]
  ['2026-11-13','2026-11-15','Was/were, conectores y tiempo',['be','conn','time']],
  ['2026-11-16','2026-11-18','Verbos regulares (-ed)',['reg']],
  ['2026-11-19','2026-11-22','Verbos irregulares',['irr']],
  ['2026-11-23','2026-11-24',"Negativo con didn't",['neg']],
  ['2026-11-25','2026-11-29','Preguntas con Did',['q']],
  ['2026-11-30','2026-12-01','Mezcla de todo + simulacro',['be','reg','irr','neg','q','conn','time','read']],
  ['2026-12-02','2026-12-03','Repaso de errores y listening',['dict','irr','q']],
  ['2026-12-04','2026-12-04','Día de la prueba. ¡Tú puedes!',['be','irr','neg','q']]
];

/* ====== Utilidades ====== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nz = s => String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.?!,;:]/g,'').replace(/\s+/g,' ').trim();
const shuffle = a => { a = [...a]; for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const hid = s => { let h=0; for (const c of s) h=(h*31+c.charCodeAt(0))|0; return (h>>>0).toString(36); };
const questionId = q => hid(q.topic+'|'+q.type+'|'+q.q+'|'+(q.answer||'')+'|'+((q.answers||[]).join('/')));
const dayKey = (d=new Date()) => new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
function say(text, rate=.85){
  try {
    if (typeof speechSynthesis === 'undefined' || typeof SpeechSynthesisUtterance === 'undefined') throw new Error('Voz no disponible');
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate;
    u.onerror = () => {
      const fb = $('#fb');
      if (fb && S && S.qs && !S.finished) fb.textContent = '⚠️ El audio no se pudo reproducir. Comprueba la voz de inglés del navegador.';
    };
    speechSynthesis.speak(u);
    return true;
  } catch(e) {
    const fb = $('#fb');
    if (fb) fb.textContent = '⚠️ Este navegador no pudo reproducir el audio. Prueba Chrome o Edge.';
    return false;
  }
}

/* ====== Estado (localStorage) ====== */
let state = {box:{},wrong:{},xp:0,streak:0,lastDay:'',today:{d:'',n:0},custom:[],learned:{},review:{},lessonResults:{},activity:{},exams:[],skills:{}};
let storageFailed = false;
try {
  const raw = localStorage.getItem(LS);
  if (raw) {
    const loaded = JSON.parse(raw);
    if (!loaded || typeof loaded !== 'object' || Array.isArray(loaded)) throw new Error('Estado inválido');
    Object.assign(state, loaded);
    if (!state.box || typeof state.box !== 'object' || Array.isArray(state.box)) state.box = {};
    if (!state.wrong || typeof state.wrong !== 'object' || Array.isArray(state.wrong)) state.wrong = {};
    if (!state.today || typeof state.today !== 'object') state.today = {d:'',n:0};
    if (!Array.isArray(state.custom)) state.custom = [];
    if (!state.learned || typeof state.learned !== 'object' || Array.isArray(state.learned)) state.learned = {};
    if (!state.review || typeof state.review !== 'object' || Array.isArray(state.review)) state.review = {};
    if (!state.lessonResults || typeof state.lessonResults !== 'object' || Array.isArray(state.lessonResults)) state.lessonResults = {};
    if (!state.activity || typeof state.activity !== 'object' || Array.isArray(state.activity)) state.activity = {};
    if (!Array.isArray(state.exams)) state.exams = [];
    if (!state.skills || typeof state.skills !== 'object' || Array.isArray(state.skills)) state.skills = {};
    state.custom = state.custom.filter(q => q && typeof q === 'object' && typeof q.topic === 'string' && typeof q.type === 'string');
  }
} catch(e) { storageFailed = true; }
const save = () => {
  try { localStorage.setItem(LS, JSON.stringify(state)); storageFailed = false; const warning = $('#save-warning'); if (warning) warning.style.display = 'none'; return true; }
  catch(e) {
    storageFailed = true;
    const warning = $('#save-warning');
    if (warning) warning.style.display = 'block';
    return false;
  }
};

/* ====== Banco de preguntas ====== */
const M = (topic,q,opts,ans,exp) => ({topic,type:'mcq',q,options:opts,answer:ans,explain:exp||''});
const T = (topic,q,answers,exp) => ({topic,type:'type',q,answers,explain:exp||''});
const O = (topic,sentence,exp) => ({topic,type:'order',answer:sentence,q:'Ordena las palabras para formar la oración:',explain:exp||''});
const D = (sentence) => ({topic:'dict',type:'dict',answer:sentence,q:'Escucha y escribe exactamente lo que oyes:',explain:''});

const HAND = [
 // Was / Were
 M('be','Yesterday I ___ at home.',['was','were','am'],0,'I / he / she / it → was'),
 M('be','They ___ in Paris last week.',['was','were','are'],1,'we / you / they → were'),
 M('be','She ___ very happy at the party.',['were','was','is'],1,'she → was'),
 M('be','We ___ tired after the trip.',['was','were','are'],1,'we → were'),
 M('be','The weather ___ cold yesterday.',['were','is','was'],2,'the weather = it → was'),
 T('be',"It ___ sunny last Sunday. (negativo, forma corta)",["wasn't","was not"],"was + not = wasn't"),
 T('be',"My friends ___ at school yesterday. (negativo, forma corta)",["weren't","were not"],"were + not = weren't"),
 M('be','___ you at the gym last night?',['Was','Were','Did'],1,'Con be en pasado se invierte: Were you…?  (NO se usa did)'),
 M('be','___ he your teacher in 2020?',['Were','Did','Was'],2,'he → Was he…?'),
 M('be','Where ___ you last weekend?',['was','did','were'],2,'Wh- + were + you'),
 M('be','Were you at home? — Yes, I ___.',['was','were','did'],0,'Respuesta corta: Yes, I was.'),
 M('be',"Was there a bank near here? — No, there ___.",["weren't","wasn't","didn't"],1,'there was (singular) → wasn\'t'),
 T('be','Were they late? — Yes, they ___.',['were'],'Yes, they were.'),
 M('be','Why ___ she sad yesterday?',['were','did','was'],2,'she → was'),
 O('be','Where were you last night?','Wh- + were + sujeto'),
 O('be',"The movie wasn't very good.",'wasn\'t = was not'),
 // Regulares
 M('reg','Last night I ___ TV.',['watch','watched','watching'],1,'Pasado regular: verbo + -ed'),
 M('reg','She ___ to the radio yesterday.',['listen','listens','listened'],2,'listen → listened'),
 M('reg','We ___ football on Sunday.',['played','plays','play'],0,'play → played (no cambia la y después de vocal)'),
 T('reg','Yesterday he ___ (cook) dinner for his family.',['cooked'],'cook → cooked'),
 T('reg','They ___ (visit) their grandparents last month.',['visited'],'visit → visited'),
 // Negativo
 M('neg','I ___ go to school yesterday.',["didn't","don't","wasn't"],0,"didn't + verbo base"),
 M('neg',"She didn't ___ breakfast this morning.",['have','had','has'],0,"Después de didn't, el verbo va en base: have"),
 M('neg',"They didn't ___ the movie.",['watched','watch','watches'],1,"didn't + watch (NO watched)"),
 T('neg','He ___ (not / go) to work on Monday.',["didn't go","did not go"],"didn't + go"),
 T('neg','We ___ (not / see) Anna last week.',["didn't see","did not see"],"didn't + see"),
 M('neg','Elige la oración correcta:',["She didn't went home.","She didn't go home.","She not went home."],1,"didn't + verbo base"),
 M('neg','I ___ study last night, so the test was hard.',["didn't","wasn't","don't"],0,"didn't study"),
 T('neg','I ___ (not / eat) lunch yesterday.',["didn't eat","did not eat"],"didn't + eat"),
 M('neg','He ___ at home yesterday. (negativo)',["didn't be","wasn't","didn't was"],1,"Con be NO se usa didn't: was → wasn't"),
 O('neg',"I didn't go out because it rained.",'because explica la razón'),
 // Preguntas
 M('q','___ you play tennis last Sunday?',['Did','Do','Were'],0,'Did + sujeto + verbo base'),
 M('q','Did she ___ the homework?',['do','did','does'],0,'Después de Did, verbo en base: do'),
 M('q','Where did they ___ last summer?',['go','went','going'],0,'Did + they + go'),
 M('q','Did he call you? — No, he ___.',["didn't","wasn't","doesn't"],0,'Respuesta corta: No, he didn\'t.'),
 M('q','Did you see Tom? — Yes, I ___.',['did','was','saw'],0,'Yes, I did.'),
 T('q','What time did you ___ (get up) yesterday?',['get up'],'Did + sujeto + verbo base'),
 O('q','Did you meet her at the party?','Did + sujeto + verbo base'),
 O('q','What did you eat for lunch?','What + did + sujeto + verbo base'),
 O('q','Where did he go last night?','Where + did + sujeto + verbo base'),
 M('q','Elige la pregunta correcta:',['Did you went to the park?','Did you go to the park?','You did go to the park?'],1,'Did + you + go (base)'),
 M('q','When ___ you arrive?',['did','were','was'],0,'Wh- + did + sujeto + verbo base'),
 T('q',"Did they like the food? — No, they ___.",["didn't"],"Respuesta corta negativa: didn't"),
 M('q','___ she at the party last night?',['Did','Was','Were'],1,'Con be: Was she…? (NO Did)'),
 // Conectores
 M('conn','I went to bed early ___ I was tired.',['because','but','and'],0,'because = porque (razón)'),
 M('conn','The food was good, ___ it was expensive.',['because','and','but'],2,'but = pero (contraste)'),
 M('conn','We visited a museum ___ had lunch.',['but','and','because'],1,'and = y (suma)'),
 M('conn',"She didn't come ___ she was sick.",['because','but','and'],0,'because = razón'),
 M('conn','I wanted to go out, ___ it rained.',['and','but','because'],1,'but = contraste'),
 M('conn','He studied hard ___ passed the test.',['but','because','and'],2,'and = y'),
 M('conn','I stayed home ___ the weather was bad.',['and','because','but'],1,'because = razón'),
 M('conn','I liked the hotel, ___ it was far from the beach.',['but','because','and'],0,'but = contraste'),
 T('conn','She was late ___ the bus broke down. (and / but / because)',['because'],'because = razón'),
 // Tiempo y clima
 M('time','I visited my grandma ___ week.',['last','ago','yesterday'],0,'last week / last night / last year'),
 M('time','We went to Spain two years ___.',['last','ago','before'],1,'two years ago'),
 M('time','She was born ___ 1999.',['on','at','in'],2,'in + año'),
 M('time','I called him ___ night.',['yesterday','last','ago'],1,'last night'),
 M('time','I saw her ___ morning.',['yesterday','last','ago'],0,'yesterday morning'),
 M('time','It was ___ yesterday. I needed an umbrella.',['rainy','sunny','windy'],0,'rainy = lluvioso'),
 M('time','It was very ___. I wore a hat for the sun.',['snowy','sunny','cloudy'],1,'sunny = soleado'),
 T('time','"Ayer" en inglés:',['yesterday'],'yesterday'),
 T('time','Hace tres días = three days ___',['ago'],'three days ago'),
 M('time','My birthday was ___ March 3rd.',['in','on','at'],1,'on + fecha exacta'),
 M('time','We traveled ___ July.',['on','in','at'],1,'in + mes'),
 M('time','The party was ___ Saturday.',['in','at','on'],2,'on + día de la semana'),
 // Lectura
 M('read','Last weekend, Ana went to the beach with her friends. It was sunny, but the water was cold. They played volleyball and ate pizza. Ana didn\'t swim because she was tired.\n\nDid Ana swim?',['Yes, she did.',"No, she didn't.",'Yes, she was.'],1,"El texto dice: Ana didn't swim."),
 M('read','Last weekend, Ana went to the beach with her friends. It was sunny, but the water was cold. They played volleyball and ate pizza. Ana didn\'t swim because she was tired.\n\nWhy didn\'t Ana swim?',['The water was warm.','She was tired.','It was rainy.'],1,'because she was tired'),
 M('read','Tom woke up late yesterday. He didn\'t have breakfast and he ran to the bus stop. He was late for school, but his teacher wasn\'t angry.\n\nWhat did Tom do first?',['He ran to the bus stop.','He had breakfast.','He woke up late.'],2,'Secuencia: woke up → no breakfast → ran'),
 M('read','Tom woke up late yesterday. He didn\'t have breakfast and he ran to the bus stop. He was late for school, but his teacher wasn\'t angry.\n\nWas the teacher angry?',["Yes, he was.","No, he wasn't.","No, he didn't."],1,"his teacher wasn't angry"),
 // ---- Del libro 1B (Wide Angle, unidades 7 y 8): fechas, vocabulario, pronunciación, conectores ----
 T('time','Escribe la fecha con palabras: 5/18',['may eighteenth','may 18th','may the eighteenth'],'En el libro (inglés americano) el mes va primero: 5/18 = May 18th'),
 T('time','Escribe la fecha con palabras: 7/4',['july fourth','july 4th','july the fourth'],'7/4 = July fourth'),
 T('time','Escribe la fecha con palabras: 10/31',['october thirty-first','october thirty first','october 31st','october the thirty-first'],'31 → thirty-first'),
 T('time','Escribe la fecha con palabras: 12/25',['december twenty-fifth','december twenty fifth','december 25th'],'25 → twenty-fifth'),
 T('time','Escribe la fecha con palabras: 2/2',['february second','february 2nd'],'2 → second'),
 M('time','¿Cómo se lee el año 1620?',['sixteen twenty','one six two zero','sixteen hundred twenty'],0,'Los años se leen en dos números: sixteen / twenty'),
 M('time','¿Cómo se lee el año 1984?',['nineteen eighty-four','one nine eight four','ninety-eighty four'],0,'nineteen + eighty-four'),
 M('time','¿Cómo se lee 2001?',['twenty zero one','two thousand and one','two hundred one'],1,'2000–2009: two thousand (and) one'),
 M('time','El ordinal de 3 es…',['three','third','threeth'],1,'1st first · 2nd second · 3rd third'),
 M('time','El ordinal de 12 es…',['twelve','twelveth','twelfth'],2,'12th = twelfth'),
 M('time','The test is ___ December 4th.',['in','on','at'],1,'on + fecha exacta'),
 M('time','He opened the hotel ___ the 1890s.',['in','on','ago'],0,'in the + década: in the 1890s'),
 M('time','Many hotels opened ___ the early 1900s.',['on','in the','last'],1,'in the early / late 1900s'),
 M('vocab','It is warm and the ___ is out.',['sun','snow','wind'],0,'the sun is out = hay sol'),
 M('vocab','There are gray ___ in the sky.',['clouds','jeans','shoes'],0,'clouds = nubes'),
 M('vocab','It was bad weather: a lot of rain and ___.',['wind','dress','hat'],0,'rain and wind = lluvia y viento'),
 M('vocab','Which word is NOT clothing?',['skirt','jacket','cloudy'],2,'cloudy = nublado (clima)'),
 T('vocab','«falda» en inglés:',['skirt'],'a skirt'),
 T('vocab','«chaqueta» en inglés:',['jacket'],'a jacket'),
 T('vocab','«vestido» en inglés:',['dress'],'a dress'),
 T('vocab','«polera / camiseta» en inglés:',['t-shirt','t shirt','tshirt'],'a T-shirt'),

}

/* ====== Selección con repetición espaciada ====== */
// Leitner por nivel + agenda de repaso en días diferentes.
const reviewDue = q => { const r=state.review[q.id]; return r && typeof r.due==='string' && r.due<=dayKey(); };
const dueCount = () => BANK.filter(reviewDue).length;
const weight = q => {
  const b=state.box[q.id], r=state.review[q.id];
  if (reviewDue(q)) return 12;
  if (r && r.due>dayKey()) return state.wrong[q.id] ? 2 : 0.3;
  return b===undefined ? 5 : [8,4,2,1,0.4][Math.max(0,Math.min(4,b))];
};
function pick(pool,n){
  const p=[...pool], out=[];
  while(out.length<n && p.length){
    const tot=p.reduce((a,q)=>a+weight(q),0); let r=Math.random()*tot, k=0;
    for(;k<p.length;k++){ r-=weight(p[k]); if(r<=0) break; }
    out.push(p.splice(Math.min(k,p.length-1),1)[0]);
  }
  return out;
}
const mastered = q => (state.box[q.id]||0) >= 3;

/* ====== Racha / XP ====== */
function touchDay(){
  const t = dayKey();
  if (state.today.d !== t) state.today = {d:t,n:0};
  if (state.lastDay !== t){
    const y = dayKey(new Date(Date.now()-864e5));
    state.streak = state.lastDay === y ? state.streak+1 : 1;
    state.lastDay = t;
  }
}
function record(q, ok){
  touchDay();
  const today=dayKey();
  state.today.n++;
  const r=state.review[q.id] && typeof state.review[q.id]==='object' ? state.review[q.id] : {};
  const nextCorrect = ok ? Math.min(6,(Number(r.streak)||0)+1) : 0;
  const days=[1,1,2,4,7,14,30][nextCorrect];
  const nextDate=new Date(today+'T12:00:00');
  nextDate.setDate(nextDate.getDate()+days);
  const due=dayKey(nextDate);
  const daily=state.activity[today] && typeof state.activity[today]==='object' ? state.activity[today] : {n:0,ok:0};
  daily.n=(daily.n||0)+1; if(ok) daily.ok=(daily.ok||0)+1;
  state.activity[today]=daily;
  if (Object.keys(state.activity).length>180) delete state.activity[Object.keys(state.activity).sort()[0]];
  if (ok){
    state.box[q.id]=Math.min(4,(state.box[q.id]||0)+1);
    state.xp+=10;
    const recovered=(state.wrong[q.id] && r.recoveryDay!==today) ? (Number(r.recovery)||0)+1 : (Number(r.recovery)||0);
    if(state.wrong[q.id] && recovered>=2) delete state.wrong[q.id];
    state.review[q.id]={streak:nextCorrect,due,last:today,recovery:recovered,recoveryDay:state.wrong[q.id]?today:'',lapses:Number(r.lapses)||0};
  } else {
    state.box[q.id]=0;
    state.wrong[q.id]=(state.wrong[q.id]||0)+1;
    state.xp+=2;
    state.review[q.id]={streak:0,due,last:today,recovery:0,recoveryDay:'',lapses:(Number(r.lapses)||0)+1};
  }
  save();
}

/* ====== Revisión de respuesta ====== */
function correctText(q){
  if (q.type==='mcq') return q.options[q.answer];
  if (q.type==='type') return q.answers[0];
  return q.answer;
}
function isRight(q, user){
  if (q.type==='mcq') return user === q.answer;
  if (q.type==='type') return q.answers.some(a => nz(a) === nz(user));
  return nz(q.answer) === nz(user);
}

/* ====== Pantallas ====== */
const app = $('#app');
let S = null, timer = null;
function clearSession(){
  try { localStorage.removeItem(LS_SESSION); } catch(e){}
}
function saveSession(){
  if (!S || !S.qs || S.finished) return;
  try {
    localStorage.setItem(LS_SESSION, JSON.stringify({
      ids:S.qs.map(q => q.id), i:S.i, ok:S.ok,
      res:S.res.map(r => ({id:r.q.id,ok:r.ok,user:r.user})),
      exam:S.exam, title:S.title, end:S.end, startedAt:S.startedAt||Date.now(), answered:locked
    }));
  } catch(e) { storageFailed = true; const el=$('#save-warning'); if(el) el.style.display='block'; }
}
function restoreSession(){
  try {
    const raw = localStorage.getItem(LS_SESSION);
    if (!raw) return false;
    const old = JSON.parse(raw);
    if (!old || !Array.isArray(old.ids) || !old.ids.length || old.ids.length>100 ||
        !Number.isInteger(old.i) || old.i<0 || old.i>=old.ids.length ||
        !Number.isInteger(old.ok) || old.ok<0 || old.ok>old.ids.length ||
        !Array.isArray(old.res) || old.res.length>old.ids.length ||
        typeof old.title!=='string' || old.title.length>150 ||
        typeof old.exam!=='boolean' || !Number.isFinite(old.end)) return false;
    const byId = new Map(BANK.map(q => [q.id,q]));
    const qs = old.ids.map(id=>byId.get(id));
    const res = old.res.map(r=>({q:byId.get(r.id),ok:r.ok,user:r.user}));
    if (qs.some(q=>!q) || res.some(r=>!r.q || typeof r.ok!=='boolean') ||
        old.res.length!==old.i+(old.answered?1:0)) return false;
    S = {qs,i:old.i,ok:old.ok,res,exam:old.exam,title:old.title,end:old.end,startedAt:Number(old.startedAt)||Date.now(),finished:false};
    locked = false;
    if (old.answered) S.i++;
    if (S.i>=S.qs.length) { finish(); return true; }
    if (S.exam){ timer = setInterval(tick,1000); if (S.end<=Date.now()){finish();return true;} }
    renderQ();
    return true;
  } catch(e){ return false; }
}

function header(){
  const days = Math.max(0, Math.ceil((EXAM - new Date())/864e5));
  const lvl = Math.floor(state.xp/200)+1;
  return `<div class="top"><h1>🇬🇧 ES4 Trainer</h1><div class="pills"><span class="pill">📅 ${days} días</span><span class="pill">🔥 ${state.streak}</span><span class="pill">⭐ Nv ${lvl} · ${state.xp} XP</span></div></div><div id="save-warning" class="fb bad" role="alert" style="display:${storageFailed?'block':'none'}">⚠️ No se pudo guardar el progreso en este navegador. Revisa el almacenamiento antes de cerrar la aplicación.</div>`;
}

function todayPlan(){
  const t = dayKey();
  const active = PLAN.find(p => t >= p[0] && t <= p[1]);
  if (active) return active;
  if (t < PLAN[0][0]) return PLAN[0];
  return ['', '', 'Repaso general después de la ES4', Object.keys(TOPICS)];
}

    <button class="big" style="margin-top:8px" data-act="learn">📖 Aprender: todas las lecciones (${LESSONS.filter(l=>state.learned[l.id]).length}/${LESSONS.length})</button>

  <div class="grid">
    <button class="big" data-act="smart">🧠 Sesión inteligente</button>
    <button class="big" data-act="exam">📝 Simulacro (30)</button>
    <button class="big" data-act="cards">🃏 Fichas de irregulares</button>
    <button class="big" data-act="errors" ${wrongN?'':'disabled'}>❌ Mis errores (${wrongN})</button>
  </div>
  <div class="card" style="margin-top:12px"><h2>Dominio por tema <span class="mut">· total ${pct}%</span></h2>${rows}</div>

  </div></div>

function startSession(qs, opts={}){
  if (!qs.length){ alert('No hay preguntas para esta sesión.'); return; }
  locked = false;
  S = {qs, i:0, ok:0, res:[], exam:!!opts.exam, title:opts.title||'Sesión', end: opts.exam ? Date.now()+30*60000 : 0, startedAt:Date.now(), finished:false};
  clearInterval(timer);
  if (S.exam){ timer = setInterval(tick,1000); }
  saveSession();
  renderQ();
}
function tick(){
  if (!S || !S.exam || S.finished) return;
  const left = Math.max(0, S.end - Date.now());
  const el = $('#timer'); if (el) el.textContent = Math.floor(left/60000)+':'+String(Math.floor(left/1000)%60).padStart(2,'0');
  if (left<=0) finish();
}

function renderQ(){
  if (!S || !S.qs || S.finished || !S.qs[S.i]) return;
  const q = S.qs[S.i]; const prog = 100*S.i/S.qs.length;
  let body = '';
  if (q.type==='mcq'){
    S.opts = shuffle(q.options.map((t,i)=>({t,i})));
    body = (q.audio?`<div class="grid" style="margin-bottom:10px"><button class="big" data-act="play">🔊 Escuchar</button><button class="big" data-act="slow">🐢 Más lento</button></div>`:'')+`<div class="q">${esc(q.q)}</div>` + S.opts.map((o,k)=>`<button class="opt" data-act="mcq" data-k="${k}">${esc(o.t)}</button>`).join('');
  } else if (q.type==='type'){
    body = `<div class="q">${esc(q.q)}</div><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe tu respuesta"><div style="margin-top:10px"><button class="pri big" data-act="check">Comprobar</button></div>`;
  } else if (q.type==='order'){
    S.pool = shuffle(q.answer.trim().split(/\s+/).map((w,i)=>({w,i}))); S.chosen = [];
    if (S.pool.length>1 && S.pool.every((x,k)=>x.i===k)) S.pool.reverse();
    body = `<div class="q">${esc(q.q)}</div><div class="chips" id="chosen"></div><div class="chips" id="pool" style="border-style:solid"></div><button class="pri big" data-act="checkorder">Comprobar</button>`;
  } else if (q.type==='dict'){
    body = `<div class="q">${esc(q.q)}</div><div class="grid" style="margin-bottom:10px"><button class="big" data-act="play">🔊 Escuchar</button><button class="big" data-act="slow">🐢 Más lento</button></div><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe la oración"><div style="margin-top:10px"><button class="pri big" data-act="check">Comprobar</button></div>`;
  }
  app.innerHTML = header() + `<button class="back" data-act="home">← Salir</button>
  <div class="card"><div style="display:flex;justify-content:space-between"><span class="tag">${esc(S.title)} · ${TOPICS[q.topic]||'Mi tema'}</span>${S.exam?'<b id="timer">30:00</b>':`<span class="mut">${S.i+1}/${S.qs.length}</span>`}</div>
  <div class="bar" style="margin:8px 0"><i style="width:${prog}%"></i></div>${body}<div id="fb"></div></div>`;
  if (q.type==='order') drawOrder();
  if (q.type==='dict' || q.audio) setTimeout(()=>{ if (S && S.qs && !S.finished && S.qs[S.i]===q) say(q.audio||q.answer); },200);
  const inp = $('#ans'); if (inp){ inp.focus(); inp.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); answer(inp.value); } }); }
  if (S.exam) tick();
}
function drawOrder(){
  $('#chosen').innerHTML = S.chosen.map(x=>`<button class="chip" data-act="unpick" data-i="${x.i}">${esc(x.w)}</button>`).join('');
  $('#pool').innerHTML = S.pool.filter(x=>!S.chosen.includes(x)).map(x=>`<button class="chip" data-act="pick" data-i="${x.i}">${esc(x.w)}</button>`).join('');
}

let locked = false;
function answer(user){
  if (!S || !S.qs || S.finished || locked) return;
  const q = S.qs[S.i];
  if (!q) return;
  if (q.type !== 'mcq' && !String(user ?? '').trim()) return;
  if (q.type === 'order' && (!S.chosen || !S.pool || S.chosen.length !== S.pool.length)) return;
  locked = true;
  const ok = isRight(q, user);
  record(q, ok); if (ok) S.ok++;
  S.res.push({q, ok, user});
  saveSession();
  if (S.exam){ next(); return; }
  if (q.type==='mcq'){
    document.querySelectorAll('.opt').forEach((b,k)=>{ const o=S.opts[k]; if(o.i===q.answer) b.classList.add('ok'); else if(k===user_k(user)) b.classList.add('bad'); });
  }
  const praise = ['¡Bien!','¡Exacto!','¡Muy bien!','¡Eso es!'][Math.floor(Math.random()*4)];
  $('#fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}"><b>${ok?'✅ '+praise+' +10 XP':'❌ Respuesta correcta: '+esc(correctText(q))}</b>${q.explain?`<div class="mut" style="margin-top:4px">💡 ${esc(q.explain)}</div>`:''}${q.type==='dict'?`<div style="margin-top:4px">${esc(q.answer)}</div>`:''}</div><button class="pri big" data-act="next" id="nextbtn">Siguiente →</button>`;
  const nb=$('#nextbtn'); if(nb) nb.focus();
  const hdr = document.querySelector('.pills'); if (hdr) { const match = header().match(/<div class="pills">([\s\S]*?)<\/div><\/div>/); if (match) hdr.innerHTML = match[1]; }
}
function user_k(u){ return S.lastK; }
function next(){ if (!S || !S.qs || S.finished) return; locked=false; S.i++; if (S.i>=S.qs.length) finish(); else { saveSession(); renderQ(); } }

function gradeOf(p){ return p>=.6 ? 4+3*(p-.6)/.4 : 1+3*p/.6; }
function finish(){
  if (!S || !S.qs || S.finished) return;
  S.finished = true;
  locked = true;
  clearInterval(timer);
  clearSession();
  // en simulacro, lo no respondido cuenta como incorrecto
  const total = S.qs.length; const p = S.ok/total; const g = gradeOf(p).toFixed(1);
  if (S.exam){
    state.exams.push({at:new Date().toISOString(),correct:S.ok,total,grade:Number(g),unanswered:total-S.res.length,minutes:Math.max(0,Math.round((Date.now()-(S.startedAt||Date.now()))/60000))});
    state.exams=state.exams.slice(-30);
    save();
  }
  const wrong = S.res.filter(r=>!r.ok);
  const left = S.qs.slice(S.res.length);
  app.innerHTML = header() + `<div class="card" style="text-align:center"><div class="tag">${esc(S.title)} terminado</div><div class="big-num">${S.ok}/${total}</div><div class="mut">${Math.round(p*100)}% correcto</div>${S.exam && left.length ? `<div class="mut">⏳ ${left.length} pregunta(s) sin responder (cuentan como incorrectas).</div>` : ''}${S.exam?`<h2 style="margin-top:10px">Nota estimada: ${g}</h2><div class="mut">(escala chilena, 60% = 4.0)</div>`:''}<div style="margin-top:8px">${p>=.9?'🏆 Excelente resultado. Sigue así.':p>=.7?'💪 Vas bien, repasa los errores.':'📚 Repite los errores y vuelve a intentar.'}</div></div>
  ${wrong.length?`<div class="card"><h2>Para repasar</h2>${wrong.map(r=>`<div class="row"><div><div>${esc(r.q.q.split('\n').pop())}</div><div class="mut">✔ ${esc(correctText(r.q))}${r.q.explain?' — '+esc(r.q.explain):''}</div></div></div>`).join('')}</div>`:''}
  <div class="grid"><button class="big" data-act="home">Inicio</button>${wrong.length?`<button class="pri big" data-act="retry">Repetir errores</button>`:''}</div>`;
  S.retry = wrong.map(r=>r.q).concat(left);
}

{"topic":"q","type":"type","q":"Did they like the food? — No, they ___.","answers":["didn't"],"explain":"respuesta corta"}

Valores permitidos de "topic": be, reg, irr, neg, q, conn, time, vocab, read, dict. En "mcq", "answer" es el número (empezando en 0) de la opción correcta, y pon tres opciones. Mezcla los 4 formatos. Las explicaciones ("explain") van en español, cortas.`;

  <button class="big" data-act="copyprompt">📋 Copiar mensaje para ChatGPT</button>

function doImport(){
  const msg = $('#impmsg'); let data;
  try{
    let raw = $('#imp').value.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
    data = JSON.parse(raw); if (!Array.isArray(data)) data = data.questions;
    if (!Array.isArray(data)) throw new Error('no es un arreglo');
  }catch(e){ msg.textContent='❌ No pude leer el JSON: '+e.message; return; }
  let ok=0, bad=0, duplicates=0;
  const known = new Set(BANK.map(q => q.id));
  data.forEach(q=>{
    try{
      if (!q || typeof q.type!=='string') throw 0;
      const topic = TOPICS[q.topic] ? q.topic : 'q';
      let n;
      if (q.type==='mcq'){ if(!q.q||!Array.isArray(q.options)||q.options.length<2||!Number.isInteger(q.answer)||q.answer<0||q.answer>=q.options.length) throw 0; n = M(topic,String(q.q),q.options.map(String),q.answer,String(q.explain||'')); }
      else if (q.type==='type'){ if(!q.q||!Array.isArray(q.answers)||!q.answers.length) throw 0; n = T(topic,String(q.q),q.answers.map(String),String(q.explain||'')); }
      else if (q.type==='order'){ if(!q.answer||String(q.answer).split(' ').length<3) throw 0; n = O(topic,String(q.answer),String(q.explain||'')); }
      else if (q.type==='dict'){ if(!q.answer) throw 0; n = D(String(q.answer)); }
      else throw 0;
      const id = questionId(n);
       if (known.has(id)) { duplicates++; return; }
       n.id = id;
       known.add(id);
       state.custom.push(n); ok++;
    }catch(e){ bad++; }
  });
  save(); BANK = buildBank();
  msg.textContent = `✅ Importadas: ${ok}. ${bad?'Con error (ignoradas): '+bad+'. ':''}${duplicates?'Duplicadas (ignoradas): '+duplicates+'.':''}`;
}

      touchDay(); state.xp+=20; save();
    }
    return i+1<LESSONS.length ? openLesson(i+1) : learnHome();
  }
  if (a==='lpractice'){ const k = b.dataset.k; return startSession(pick(BANK.filter(q=>q.topic===k),10),{title:TOPICS[k]||'Práctica'}); }
  if (a==='lchk'){
    const l = LESSONS[L.i], blk = l && l.blocks[+b.dataset.b], box = b.closest('.ck');
    if (!blk || !box || box.dataset.done) return;
    const k = +b.dataset.k, fb = box.querySelector('.ckfb');
    if (k === blk.answer){
      box.dataset.done = '1';
      if (!L.attempts[+b.dataset.b]) L.firstTry++;
      L.checks[+b.dataset.b]=true;
      box.querySelectorAll('.opt').forEach((x,i)=>{ x.disabled=true; if(i===blk.answer) x.classList.add('ok'); });
      fb.innerHTML='✅ <b>¡Correcto!</b> '+md(blk.explain||'');
      const n=Object.keys(L.checks).length, gate=$('#lesson-gate'),btn=$('#complete-lesson');
      if(gate) gate.textContent='Comprobaciones: '+n+'/3. Aciertos al primer intento: '+L.firstTry+'/3.';
      if(btn && n===3) btn.disabled=false;
    } else {
      L.attempts[+b.dataset.b]=(L.attempts[+b.dataset.b]||0)+1;
      b.classList.add('bad'); b.disabled=true;
      fb.innerHTML='❌ Inténtalo de nuevo. 💡 '+md(blk.explain||'');
    }

  }
  if (a==='plan'){ const topics = todayPlan()[3]; return startSession(pick(BANK.filter(q=>topics.includes(q.topic)),10),{title:'Hoy'}); }
  if (a==='due') return startSession(pick(BANK.filter(reviewDue),Math.min(20,dueCount())),{title:'Repaso programado'});
  if (a==='smart') return startSession(pick(BANK.filter(q=>q.topic!=='dict'||Math.random()<.3),10),{title:'Inteligente'});
  if (a==='topic') return startSession(pick(BANK.filter(q=>q.topic===b.dataset.k),10),{title:TOPICS[b.dataset.k]});
  if (a==='errors') return startSession(shuffle(BANK.filter(q=>state.wrong[q.id])).slice(0,15),{title:'Mis errores'});
  if (a==='exam'){
    const mix = {be:3,reg:3,irr:5,neg:4,q:5,conn:3,time:2,vocab:1,read:2,dict:2}; let qs=[];
    for (const k in mix) qs = qs.concat(pick(BANK.filter(q=>q.topic===k),mix[k]));
    if (qs.length<30) qs = qs.concat(pick(BANK.filter(q=>!qs.includes(q)),30-qs.length));
    return startSession(shuffle(qs),{title:'Simulacro',exam:true});
  }
  if (a==='cards') return cards();
  if (a==='import') return importScreen();
  if (a==='copyprompt'){
     const fallback = () => { $('#imp').value=S.prompt; b.textContent='Copia el texto del cuadro'; };
     try {
       if (!navigator.clipboard || !navigator.clipboard.writeText) return fallback();
       navigator.clipboard.writeText(S.prompt).then(()=>{b.textContent='✅ Copiado';}).catch(fallback);
     } catch(e) { fallback(); }
     return;
   }
  if (a==='doimport') return doImport();
  if (a==='clearcustom'){ if(confirm('¿Borrar las preguntas importadas?')){ state.custom=[]; save(); BANK=buildBank(); importScreen(); } return; }
  if (a==='flip'){ S.show=!S.show; return renderCard(); }
  if (a==='cardyes'||a==='cardno'){ const q=S.deck[S.i]; record(q,a==='cardyes'); S.i++; S.show=false; return renderCard(); }
  if (a==='retry'){ const r=S.retry; return startSession(r,{title:'Repaso'}); }
  if (!S || !S.qs) return;
  if (a==='mcq'){ if(locked) return; const k=+b.dataset.k; S.lastK=k; return answer(S.opts[k].i); }
  if (a==='check'){ const v=$('#ans').value; if(!v.trim()) return; return answer(v); }
  if (a==='play') return say(S.qs[S.i].audio||S.qs[S.i].answer,.85);
  if (a==='slow') return say(S.qs[S.i].audio||S.qs[S.i].answer,.55);
  if (a==='next') return next();
  if (a==='pick'){ const x=S.pool.find(x=>x.i===+b.dataset.i && !S.chosen.includes(x)); if(x){S.chosen.push(x); drawOrder();} return; }
  if (a==='unpick'){ S.chosen=S.chosen.filter(x=>x.i!==+b.dataset.i); return drawOrder(); }
  if (a==='checkorder'){
     if (locked) return;
     if (!S.chosen || !S.pool || S.chosen.length !== S.pool.length) {
       const fb = $('#fb'); if (fb) fb.textContent = 'Selecciona todas las palabras antes de comprobar.';
       return;
     }
     return answer(S.chosen.map(x=>x.w).join(' '));
   }
});

if (!restoreSession()) home();
</script>
